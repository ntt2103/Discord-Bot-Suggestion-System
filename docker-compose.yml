version: '3.8'
services:
  # Data Lake (Raw Zone)
  minio:
    image: minio/minio:latest
    container_name: tiki_minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console/UI Port
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio_data:/data

  # Data Warehouse / Serving Database
  postgres:
    image: postgres:15
    container_name: tiki_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=tiki_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  # Airflow Orchestrator
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: tiki_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password123@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) && (airflow scheduler & airflow webserver)"
    depends_on:
      - postgres